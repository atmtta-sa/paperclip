name: PR

on:
  pull_request:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Open same-repository PR number to verify"
        required: true
        type: number
      head_sha:
        description: "Exact 40-character PR head SHA"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  resolve_pr:
    name: Resolve exact PR revision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      head_ref: ${{ steps.resolve.outputs.head_ref }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      base_ref: ${{ steps.resolve.outputs.base_ref }}
      author_login: ${{ steps.resolve.outputs.author_login }}
      author_id: ${{ steps.resolve.outputs.author_id }}
      sender_id: ${{ steps.resolve.outputs.sender_id }}
      base_repository_id: ${{ steps.resolve.outputs.base_repository_id }}
      merge_sha: ${{ steps.resolve.outputs.merge_sha }}
      action: ${{ steps.resolve.outputs.action }}
      stack_json: ${{ steps.resolve.outputs.stack_json }}
    steps:
      - name: Validate open PR and exact head
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          ACTOR_ID: ${{ github.actor_id }}
          EVENT_MERGE_SHA: ${{ github.sha }}
          EVENT_STACK_JSON: ${{ toJSON(github.event.pull_request.stack) }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            pr_number="$EVENT_PR_NUMBER"
            head_sha="$EVENT_HEAD_SHA"
            action="$EVENT_ACTION"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            pr_number="$INPUT_PR_NUMBER"
            head_sha="$INPUT_HEAD_SHA"
            action="manual"
          else
            echo "Unsupported event: $EVENT_NAME" >&2
            exit 1
          fi

          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]

          repository_id="$(gh api "repos/$REPOSITORY" --jq .id)"
          pr_json="$(gh api "repos/$REPOSITORY/pulls/$pr_number")"
          jq -e \
            --argjson repository_id "$repository_id" \
            --arg default_branch "$DEFAULT_BRANCH" \
            --arg head_sha "$head_sha" '
              .state == "open" and
              .base.repo.id == $repository_id and
              .head.repo.id == .base.repo.id and
              .base.ref == $default_branch and
              .head.sha == $head_sha
            ' <<< "$pr_json" >/dev/null

          merge_sha="$EVENT_MERGE_SHA"
          [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]]

          {
            echo "pr_number=$pr_number"
            echo "head_sha=$head_sha"
            echo "head_ref=$(jq -r '.head.ref' <<< "$pr_json")"
            echo "base_sha=$(jq -r '.base.sha' <<< "$pr_json")"
            echo "base_ref=$(jq -r '.base.ref' <<< "$pr_json")"
            echo "author_login=$(jq -r '.user.login' <<< "$pr_json")"
            echo "author_id=$(jq -r '.user.id' <<< "$pr_json")"
            echo "sender_id=$ACTOR_ID"
            echo "base_repository_id=$repository_id"
            echo "merge_sha=$merge_sha"
            echo "action=$action"
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              echo "stack_json<<PR_STACK_JSON"
              printf '%s\n' "$EVENT_STACK_JSON"
              echo "PR_STACK_JSON"
            else
              echo "stack_json=null"
            fi
          } >> "$GITHUB_OUTPUT"

  ci:
    needs: resolve_pr
    uses: ./.github/workflows/pr-trusted.yml
    with:
      pr_number: ${{ needs.resolve_pr.outputs.pr_number }}
      head_sha: ${{ needs.resolve_pr.outputs.head_sha }}
      head_ref: ${{ needs.resolve_pr.outputs.head_ref }}
      base_sha: ${{ needs.resolve_pr.outputs.base_sha }}
      base_ref: ${{ needs.resolve_pr.outputs.base_ref }}
      author_login: ${{ needs.resolve_pr.outputs.author_login }}
      author_id: ${{ needs.resolve_pr.outputs.author_id }}
      sender_id: ${{ needs.resolve_pr.outputs.sender_id }}
      base_repository_id: ${{ needs.resolve_pr.outputs.base_repository_id }}
      merge_sha: ${{ needs.resolve_pr.outputs.merge_sha }}
      action: ${{ needs.resolve_pr.outputs.action }}
      stack_json: ${{ needs.resolve_pr.outputs.stack_json }}
