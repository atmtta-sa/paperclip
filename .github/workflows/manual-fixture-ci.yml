name: Manual fixture CI

on:
  workflow_dispatch:
  push:
    branches:
      - fix/baseline-autonomous-test-fixtures

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Setup pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Check module boundaries
        run: pnpm run check:module-boundaries

      - name: Verify heartbeat process recovery
        run: pnpm exec vitest run server/src/__tests__/heartbeat-process-recovery.test.ts

      - name: Verify modified external-chat fixture
        run: >-
          pnpm exec vitest run server/src/__tests__/chat-channels.integration.test.ts
          -t "materializes direct external-chat finals once and accepts the next turn without agent bookkeeping writes"
